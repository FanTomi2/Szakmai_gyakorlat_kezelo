version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Jelszo123!
      POSTGRES_DB: szakdogadb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d szakdogadb"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build: 
      context: ./backend
    ports:
      - "7064:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Database=szakdogadb;Username=postgres;Password=Jelszo123!

  frontend:
    build: 
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend